name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  WAILS_VERSION: v2.12.0

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check whitespace
        run: git diff --check

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Test Go packages
        run: go test ./cmd/... ./internal/...

  package-macos:
    name: Package macOS arm64
    runs-on: macos-15
    needs: checks
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install "github.com/wailsapp/wails/v2/cmd/wails@$WAILS_VERSION"

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Test
        run: go test ./...

      - name: Build app
        run: |
          VERSION="$GITHUB_REF_NAME"
          if [[ "$VERSION" != v* ]]; then
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          wails build -platform darwin/arm64 -clean -trimpath \
            -ldflags "-X cockpit/internal/version.Version=$VERSION -X cockpit/internal/version.Commit=${GITHUB_SHA::7} -X cockpit/internal/version.BuildTime=$BUILD_TIME"

      - name: Package artifact
        run: |
          SAFE_REF="${GITHUB_REF_NAME//\//-}"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/bin/cockpit.app "dist/cockpit-${SAFE_REF}-${GITHUB_SHA::7}-darwin-arm64.zip"
          shasum -a 256 dist/*.zip > dist/SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cockpit-darwin-arm64-${{ github.sha }}
          path: |
            dist/*.zip
            dist/SHA256SUMS
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
